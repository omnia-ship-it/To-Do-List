<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nazzem - مهام اليوم</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&family=El+Messiri:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-nazzem mb-4">
        <div class="container">
            <a class="navbar-brand" href="dashboard.html">
                <img src="images/Nazzem-logo.png" alt="Logo" class="img-fluid">
                <span class="brand-word">Nazzem</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto text-center">
                    <li class="nav-item"><a class="nav-link" href="dashboard.html">لوحة التحكم</a></li>
                    <li class="nav-item"><a class="nav-link active" href="today.html">مهام اليوم</a></li>
                    <li class="nav-item"><a class="nav-link" href="overdue.html">المهام المتأخرة</a></li>
                    <li class="nav-item"><a class="nav-link" href="tasks.html">كل المهام</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">

        <h4 class="page-title">مهام اليوم</h4>

        <div class="task-item">
            <div class="d-flex align-items-center">
                <input class="form-check-input" type="checkbox">
                <span class="task-title">تجهيز عرض المشروع</span>
            </div>
            <span class="task-date-badge today">اليوم - 2:00 م</span>
        </div>

        <div class="task-item">
            <div class="d-flex align-items-center">
                <input class="form-check-input" type="checkbox">
                <span class="task-title">مكالمة مع العميل</span>
            </div>
            <span class="task-date-badge today">اليوم - 4:30 م</span>
        </div>

        <div class="task-item completed">
            <div class="d-flex align-items-center">
                <input class="form-check-input" type="checkbox" checked>
                <span class="task-title">مراجعة الإيميلات الصباحية</span>
            </div>
            <span class="task-date-badge done">مكتملة</span>
        </div>

        <div class="task-item">
            <div class="d-flex align-items-center">
                <input class="form-check-input" type="checkbox">
                <span class="task-title">تحديث ملف المتابعة</span>
            </div>
            <span class="task-date-badge today">اليوم - 6:00 م</span>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
