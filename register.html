<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nazzem - إنشاء حساب</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&family=El+Messiri:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="col-11 col-sm-8 col-md-5 col-lg-4">

            <div class="card shadow-sm">
                <div class="card-body p-4">

                    <!-- Logo & Title -->
                    <div class="text-center mb-4">
                        <img src="images/Nazzem-logo.png" alt="Logo" class="img-fluid logo-img mb-1">
                        <h4 class="fw-bold">إنشاء حساب جديد</h4>
                        <p class="text-muted small">سجلي بياناتك عشان تبدأي معانا</p>
                    </div>

                    <form>

                        <!-- Full Name Field -->
                        <div class="mb-3">
                            <label for="fullName" class="form-label">الاسم بالكامل</label>
                            <input type="text" class="form-control" id="fullName" placeholder="اسمك بالكامل" required>
                        </div>

                        <!-- Email Field -->
                        <div class="mb-3">
                            <label for="email" class="form-label">البريد الإلكتروني</label>
                            <input type="email" class="form-control" id="email" placeholder="example@email.com" required>
                        </div>

                        <!-- Password Field -->
                        <div class="mb-3">
                            <label for="password" class="form-label">كلمة المرور</label>
                            <input type="password" class="form-control" id="password" placeholder="********" required>
                        </div>

                        <!-- Confirm Password Field -->
                        <div class="mb-3">
                            <label for="confirmPassword" class="form-label">تأكيد كلمة المرور</label>
                            <input type="password" class="form-control" id="confirmPassword" placeholder="********" required>
                        </div>

                        <!-- Terms checkbox -->
                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" id="agreeTerms" required>
                            <label class="form-check-label small" for="agreeTerms">
                                موافقة على <a href="#" class="text-decoration-none">الشروط والأحكام</a>
                            </label>
                        </div>

                        <!-- Submit Button -->
                        <button type="submit" class="btn btn-primary w-100 mt-2">إنشاء الحساب</button>

                        <!-- Login Link -->
                        <p class="text-center small mt-3 mb-0">
                            عندك حساب بالفعل؟
                            <a href="login.html" class="text-decoration-none fw-bold">سجلي دخولك</a>
                        </p>

                    </form>

                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
