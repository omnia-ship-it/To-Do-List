<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nazzem - لوحة التحكم</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&family=El+Messiri:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-nazzem mb-4">
        <div class="container">
            <a class="navbar-brand" href="dashboard.html">
                <img src="images/Nazzem-logo.png" alt="Logo" class="img-fluid">
                <span class="brand-word">Nazzem</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto text-center">
                    <li class="nav-item"><a class="nav-link active" href="dashboard.html">لوحة التحكم</a></li>
                    <li class="nav-item"><a class="nav-link" href="today.html">مهام اليوم</a></li>
                    <li class="nav-item"><a class="nav-link" href="overdue.html">المهام المتأخرة</a></li>
                    <li class="nav-item"><a class="nav-link" href="tasks.html">كل المهام</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">

        <h4 class="page-title">مرحبًا بيكي 👋</h4>

        <!-- Stats -->
        <div class="row g-3 mb-4">
            <div class="col-6 col-md-3">
                <div class="stat-card stat-total">
                    <i class="bi bi-list-check stat-icon"></i>
                    <div class="stat-number">24</div>
                    <div class="stat-label">إجمالي المهام</div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="stat-card stat-done">
                    <i class="bi bi-check-circle stat-icon"></i>
                    <div class="stat-number">15</div>
                    <div class="stat-label">مهام مكتملة</div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="stat-card stat-today">
                    <i class="bi bi-sun stat-icon"></i>
                    <div class="stat-number">5</div>
                    <div class="stat-label">مهام اليوم</div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="stat-card stat-overdue">
                    <i class="bi bi-exclamation-circle stat-icon"></i>
                    <div class="stat-number">4</div>
                    <div class="stat-label">مهام متأخرة</div>
                </div>
            </div>
        </div>

        <!-- Recent Tasks -->
        <h6 class="fw-bold mb-3">آخر المهام</h6>

        <div class="task-item">
            <div class="d-flex align-items-center">
                <input class="form-check-input" type="checkbox">
                <span class="task-title">تجهيز عرض المشروع</span>
            </div>
            <span class="task-date-badge today">اليوم</span>
        </div>

        <div class="task-item overdue">
            <div class="d-flex align-items-center">
                <input class="form-check-input" type="checkbox">
                <span class="task-title">مراجعة تقرير المبيعات</span>
            </div>
            <span class="task-date-badge overdue">متأخرة - أمس</span>
        </div>

        <div class="task-item completed">
            <div class="d-flex align-items-center">
                <input class="form-check-input" type="checkbox" checked>
                <span class="task-title">إرسال الإيميل للفريق</span>
            </div>
            <span class="task-date-badge done">مكتملة</span>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
