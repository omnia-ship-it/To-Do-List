<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اسم مشروعك - تسجيل الدخول</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&family=El+Messiri:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="col-11 col-sm-8 col-md-5 col-lg-4">

            <div class="card shadow-sm">
                <div class="card-body p-4">

                    <!-- Logo & Title -->
                    <div class="text-center mb-4">
                        <img src="images/Nazzem-logo.png" alt="Logo" class="img-fluid logo-img mb-2">
                        <h4 class="fw-bold">تسجيل الدخول</h4>
                        <p class="text-muted small">أهلاً بيكي، سجلي دخولك للمتابعة</p>
                    </div>

                    <form>

                        <!-- Email Field -->
                        <div class="mb-3">
                            <label for="email" class="form-label">البريد الإلكتروني</label>
                            <input type="email" class="form-control" id="email" placeholder="example@email.com" required>
                        </div>

                        <!-- Password Field -->
                        <div class="mb-3">
                            <label for="password" class="form-label">كلمة المرور</label>
                            <input type="password" class="form-control" id="password" placeholder="********" required>
                        </div>

                        <!-- Remember me + Forgot password -->
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="rememberMe">
                                <label class="form-check-label small" for="rememberMe">
                                    تذكرني
                                </label>
                            </div>
                            <a href="forgot-password.html" class="small text-decoration-none">نسيت كلمة المرور؟</a>
                        </div>

                        <!-- Submit Button -->
                        <button type="submit" class="btn btn-primary w-100 mt-2">تسجيل الدخول</button>

                        <!-- Register Link -->
                        <p class="text-center small mt-3 mb-0">
                            معندكيش حساب؟
                            <a href="register.html" class="text-decoration-none fw-bold">سجلي دلوقتي</a>
                        </p>

                    </form>

                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
